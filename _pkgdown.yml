url: https://eppicenter.github.io/ampseq-qc/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, example]
    right: [search, github]
  components:
    example:
      text: Example report
      href: example-report/QC_report.html

reference:
