      - summarise_samples
      - generate_reprep_repool_table
      - fill_missing_data
      - samples_with_status
      - qc_status_counts
      - qc_summary_by_batch
  - title: Controls
    contents:
      - add_allele_frequency
      - summarise_positive_controls
      - negative_control_amplicons
      - negative_control_targets_over_threshold
      - summarise_negative_control_targets
